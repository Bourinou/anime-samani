name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a preview release after a successful build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Exercise the actual Electron window
        run: npm run test:electron
      - name: Build Windows packages
        run: npm run build:win:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
      - name: Collect downloads and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/*.exe,dist/*.zip release-assets/
          Copy-Item NOTICE.md,LICENSE,RELEASE-NOTES.md release-assets/
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          git archive --format=zip --prefix="anime-sama-to-desktop-$appVersion/" --output="release-assets/Anime-Sama-to-$appVersion-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Anime-Sama-to-Windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish preview downloads
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Anime-Sama-to-Windows
          path: release-assets
      - name: Publish a new version without replacing existing releases
        run: node scripts/release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
