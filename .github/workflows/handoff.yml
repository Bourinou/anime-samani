name: Discord link handoff page
on:
  push:
    branches: [main]
    paths: [handoff/**, .github/workflows/handoff.yml, scripts/tidy-repository.cjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samani-handoff
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure the requested GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: handoff
      - uses: actions/deploy-pages@v4
        id: deploy

  tidy:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep the live deployment and remove the merged review branch
        run: node scripts/tidy-repository.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
