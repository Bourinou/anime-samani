name: Problème / Bug report
description: Signaler un problème dans Anime Samani / Report an Anime Samani issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Merci de ne partager ni jeton, ni cookie, ni profil complet. / Never share tokens, cookies or entire profiles."
  - type: input
    id: version
    attributes:
      label: Version de Samani / Samani version
      placeholder: "0.3.0 — Setup ou Portable"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows / Windows version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Étapes, résultat et code exact / Steps, result and exact error
      description: "La page fonctionne-t-elle dans votre navigateur ? / Does the same page work in your browser?"
    validations:
      required: true
